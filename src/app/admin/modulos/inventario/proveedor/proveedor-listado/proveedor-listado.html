<app-listado-toolbar
  [tabs]="tabs()"
  [activeTab]="activeFilter()"
  [searchValue]="searchQuery()"
  (searchChange)="onSearchChange($event)"
  (searchSubmit)="onSearchSubmit($event)"
  (tabChange)="setFilter($any($event))"
/>

<app-grid
  [serverSide]="true"
  [loadData]="loadProveedores"
  [rowHeight]="52"
  [mostrarFiltro]="false"
  [colDefs]="colDefs"
  [exportarSignal]="exportarSignal"
  [imprimirSignal]="imprimirSignal"
  [subtitulo]="subtitulo"
  campoEstado="estado"
  (consultarObj)="consultarObj($event)"
  (cambiarEstados)="cambiarEstados($event)"
  (eliminarObj)="eliminarObj($event)"
  (gridApiReady)="onGridReady($event)"
/>
