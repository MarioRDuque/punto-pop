<app-floating-configurator />
<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden px-4"
>
  <div
    class="w-full flex flex-col items-center bg-surface-0 dark:bg-surface-900 py-10 px-8 sm:px-10 rounded-2xl shadow-md"
    style="max-width: 26rem"
  >
    @if (!enviado()) {
      <div
        class="flex justify-center items-center border-2 border-primary rounded-full mb-4"
        style="height: 3.2rem; width: 3.2rem"
      >
        <i class="pi pi-key text-2xl! text-primary"></i>
      </div>
      <h1 class="text-surface-900 dark:text-surface-0 font-bold text-2xl mb-2 text-center">
        ¿Olvidaste tu contraseña?
      </h1>
      <p class="text-muted-color mb-6 text-center">
        Ingresá tu email y te enviamos un link para restablecerla.
      </p>

      <form [formGroup]="form" (ngSubmit)="enviar()" autocomplete="off" novalidate class="w-full">
        <div class="mb-4">
          <app-input
            label="Email"
            id="email"
            icon="pi pi-envelope"
            [uppercase]="false"
            [autofocus]="true"
          />
        </div>
        <p-button
          type="submit"
          label="Enviar link"
          icon="pi pi-arrow-right"
          iconPos="right"
          styleClass="w-full"
          [loading]="cargando()"
        />
      </form>
    } @else {
      <div
        class="flex justify-center items-center border-2 border-green-500 rounded-full mb-4"
        style="height: 3.2rem; width: 3.2rem"
      >
        <i class="pi pi-check text-2xl! text-green-500"></i>
      </div>
      <h1 class="text-surface-900 dark:text-surface-0 font-bold text-2xl mb-2 text-center">
        Revisá tu email
      </h1>
      <p class="text-muted-color mb-6 text-center">
        Si el email existe en nuestro sistema, vas a recibir un link para restablecer tu contraseña.
      </p>
    }

    <a routerLink="/auth/login" class="text-primary font-medium mt-2">Volver a iniciar sesión</a>
  </div>
</div>
